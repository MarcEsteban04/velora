name: velora
description: "Velora: a friendly companion for tracking your money."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/mascot/
    - assets/images/accounts/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
